name: Benchmarks

# Gas/resource-cost benchmarks (issue #53). Runs on demand (workflow_dispatch)
# and on PRs that touch the benchmarked contracts.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - 'contracts/matching-engine/**'
      - 'contracts/governance/**'
      - 'contracts/trade-settlement/**'
      - '.github/workflows/benchmarks.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-benchmarks-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks (report)
        run: cargo run --release -p benchmarks

      - name: Benchmark regression check
        run: cargo run --release -p benchmarks -- --check
