name: Contracts Check

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  discover:
    # Derive the crate list from the repository layout so a missing matrix
    # entry (like notification / cross-chain-bridge once were) fails loudly
    # instead of silently skipping CI coverage for a crate.
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.list.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover contract crates
        id: list
        run: |
          set -euo pipefail
          contracts=$(find contracts -mindepth 2 -maxdepth 2 -name Cargo.toml -printf '%h\n' \
            | xargs -n1 basename | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "Discovered crates: $contracts"

  check-contracts:
    needs: discover
    runs-on: ubuntu-latest
    defaults:
      working-directory: contracts
    strategy:
      matrix:
        contract: ${{ fromJSON(needs.discover.outputs.contracts) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cd ${{ matrix.contract }} && cargo check --lib

      - name: Run cargo fmt (lint check)
        run: cd ${{ matrix.contract }} && cargo fmt --all --check

      - name: Run cargo clippy
        run: cd ${{ matrix.contract }} && cargo clippy --all-targets --all-features -- -D warnings

      - name: Build WASM binary
        run: cd ${{ matrix.contract }} && cargo build --target wasm32-unknown-unknown --release

      - name: Check contract size (64 KiB limit)
        run: |
          wasm="target/wasm32-unknown-unknown/release/${{ matrix.contract }}.wasm"
          if [ -f "$wasm" ]; then
            size=$(stat -c%s "$wasm")
            echo "$wasm: $size bytes"
            if [ $size -gt 65536 ]; then
              echo "ERROR: $wasm exceeds 64 KiB (65536 bytes) Soroban limit"
              exit 1
            fi
            echo "OK: $size bytes (headroom: $((65536 - size)) bytes)"
          else
            echo "No WASM produced for ${{ matrix.contract }}"
          fi

      - name: Run tests
        run: cd ${{ matrix.contract }} && cargo test

  check-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cargo check --manifest-path integration-tests/Cargo.toml

      - name: Run cargo fmt (lint check)
        run: cargo fmt --manifest-path integration-tests/Cargo.toml --all --check

      - name: Run cargo clippy
        run: cargo clippy --manifest-path integration-tests/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run integration tests
        run: cargo test --manifest-path integration-tests/Cargo.toml
