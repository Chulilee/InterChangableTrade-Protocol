name: Contracts Check

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # NOTE: the matrix is static by design to keep the workflow trivially
  # evaluable. The real, historical cause of the zero-job startup failures
  # was a malformed `defaults:` block (`working-directory:` directly under
  # `defaults` instead of `defaults.run.working-directory`), which made
  # GitHub reject the workflow at evaluation time since October 2026. Keep
  # this list in sync with `find contracts -mindepth 2 -maxdepth 2
  # -name Cargo.toml` when adding a contract.
  check-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    strategy:
      fail-fast: false
      matrix:
        contract:
          - shared-auth
          - access-control
          - asset-registry
          - cross-chain-bridge
          - escrow
          - fee-commission
          - governance
          - liquidity-incentives
          - margining-liquidation
          - marketplace
          - matching-engine
          - notification
          - orderbook
          - price-oracle
          - risk-management
          - trade-matching
          - trade-settlement

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cd ${{ matrix.contract }} && cargo check --lib

      - name: Run cargo fmt (lint check)
        run: cd ${{ matrix.contract }} && cargo fmt --all --check

      - name: Run cargo clippy
        run: cd ${{ matrix.contract }} && cargo clippy --all-targets --all-features -- -D warnings

      - name: Build WASM binary
        run: cd ${{ matrix.contract }} && cargo build --target wasm32-unknown-unknown --release

      - name: Check contract size (64 KiB limit)
        run: |
          wasm="target/wasm32-unknown-unknown/release/${{ matrix.contract }}.wasm"
          if [ -f "$wasm" ]; then
            size=$(stat -c%s "$wasm")
            echo "$wasm: $size bytes"
            if [ $size -gt 65536 ]; then
              echo "ERROR: $wasm exceeds 64 KiB (65536 bytes) Soroban limit"
              exit 1
            fi
            echo "OK: $size bytes (headroom: $((65536 - size)) bytes)"
          else
            echo "No WASM produced for ${{ matrix.contract }}"
          fi

      - name: Run tests
        run: cd ${{ matrix.contract }} && cargo test

  contract-code-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on panic! in contract code
        run: |
          if grep -RIn --include='*.rs' 'panic!(' contracts/*/src | grep -v '/test.rs:'; then
            echo "ERROR: panic!() is not allowed in contract source (except tests). Use #[contracterror] and Result." >&2
            exit 1
          fi
          echo "OK: no panic!() in contract source"

      - name: Fail on unwrap() in contract code
        run: |
          if grep -RIn --include='*.rs' '\.unwrap()' contracts/*/src | grep -v '/test.rs:'; then
            echo "ERROR: unwrap() is not allowed in contract source (except tests). Use ok_or(...)? or proper error handling." >&2
            exit 1
          fi
          echo "OK: no unwrap() in contract source"

  check-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cargo check --manifest-path integration-tests/Cargo.toml

      - name: Run cargo fmt (lint check)
        run: cargo fmt --manifest-path integration-tests/Cargo.toml --all --check

      - name: Run cargo clippy
        run: cargo clippy --manifest-path integration-tests/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run integration tests
        run: cargo test --manifest-path integration-tests/Cargo.toml
